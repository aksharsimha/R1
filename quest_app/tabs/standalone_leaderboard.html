  :root { --mono: 'JetBrains Mono', monospace; --sans: 'Inter', system-ui, sans-serif; }

  @keyframes bgPulse {
    0%,100% { background-position: 0% 50%; }
    50%      { background-position: 100% 50%; }
  }
  @keyframes orbFloat1 {
    0%,100% { transform: translate(0,0) scale(1); }
    33%     { transform: translate(40px,-50px) scale(1.12); }
    66%     { transform: translate(-25px,30px) scale(0.93); }
  }
  @keyframes orbFloat2 {
    0%,100% { transform: translate(0,0) scale(1); }
    50%     { transform: translate(-50px,40px) scale(1.18); }
  }
  @keyframes orbFloat3 {
    0%,100% { transform: translate(0,0) scale(1); }
    40%     { transform: translate(30px,-20px) scale(1.08); }
    80%     { transform: translate(-15px,35px) scale(0.96); }
  }

  @keyframes trophyFloat {
    0%,100% { transform: translateY(0px) rotate(-2deg); }
    50%     { transform: translateY(-14px) rotate(2deg); }
  }
  @keyframes trophyFloat2 {
    0%,100% { transform: translateY(0px) rotate(1deg) scaleX(-1); }
    50%     { transform: translateY(-12px) rotate(-1deg) scaleX(-1); }
  }
  @keyframes trophyFloat3 {
    0%,100% { transform: translateY(0px) rotate(-1deg); }
    50%     { transform: translateY(-10px) rotate(2.5deg); }
  }

  @keyframes goldPulse {
    0%,100% { filter: drop-shadow(0 0 6px rgba(245,200,66,0.7)) drop-shadow(0 0 16px rgba(245,200,66,0.3)) brightness(1.05); }
    50%     { filter: drop-shadow(0 0 16px rgba(245,200,66,1))   drop-shadow(0 0 40px rgba(245,200,66,0.5)) drop-shadow(0 0 80px rgba(245,200,66,0.2)) brightness(1.25); }
  }
  @keyframes silverPulse {
    0%,100% { filter: drop-shadow(0 0 6px rgba(176,184,204,0.6)) drop-shadow(0 0 16px rgba(176,184,204,0.25)) brightness(1.05); }
    50%     { filter: drop-shadow(0 0 14px rgba(176,184,204,0.9)) drop-shadow(0 0 36px rgba(176,184,204,0.4)) brightness(1.2); }
  }
  @keyframes bronzePulse {
    0%,100% { filter: drop-shadow(0 0 6px rgba(205,124,58,0.6)) drop-shadow(0 0 16px rgba(205,124,58,0.25)) brightness(1.1) sepia(0.15); }
    50%     { filter: drop-shadow(0 0 14px rgba(205,124,58,0.9)) drop-shadow(0 0 36px rgba(205,124,58,0.45)) brightness(1.25) sepia(0.25); }
  }

  /* ── Hover-intensified glow (triggered by hovering a podium column) ── */
  @keyframes goldPulseHover {
    0%,100% { filter: drop-shadow(0 0 16px rgba(245,200,66,1)) drop-shadow(0 0 38px rgba(245,200,66,0.65)) drop-shadow(0 0 70px rgba(245,200,66,0.3)) brightness(1.25); }
    50%     { filter: drop-shadow(0 0 28px rgba(245,200,66,1)) drop-shadow(0 0 64px rgba(245,200,66,0.85)) drop-shadow(0 0 120px rgba(245,200,66,0.4)) brightness(1.45); }
  }
  @keyframes silverPulseHover {
    0%,100% { filter: drop-shadow(0 0 14px rgba(176,184,204,0.95)) drop-shadow(0 0 34px rgba(176,184,204,0.55)) drop-shadow(0 0 64px rgba(176,184,204,0.25)) brightness(1.2); }
    50%     { filter: drop-shadow(0 0 24px rgba(176,184,204,1)) drop-shadow(0 0 56px rgba(176,184,204,0.75)) drop-shadow(0 0 100px rgba(176,184,204,0.35)) brightness(1.4); }
  }
  @keyframes bronzePulseHover {
    0%,100% { filter: drop-shadow(0 0 14px rgba(205,124,58,0.95)) drop-shadow(0 0 34px rgba(205,124,58,0.55)) drop-shadow(0 0 64px rgba(205,124,58,0.25)) brightness(1.3) sepia(0.2); }
    50%     { filter: drop-shadow(0 0 24px rgba(205,124,58,1)) drop-shadow(0 0 56px rgba(205,124,58,0.75)) drop-shadow(0 0 100px rgba(205,124,58,0.35)) brightness(1.5) sepia(0.3); }
  }

  @keyframes cardGlow1Hover {
    0%,100% { box-shadow: 0 0 30px rgba(245,200,66,0.35), 0 0 80px rgba(245,200,66,0.18), inset 0 0 26px rgba(245,200,66,0.08); }
    50%     { box-shadow: 0 0 48px rgba(245,200,66,0.55), 0 0 120px rgba(245,200,66,0.28), inset 0 0 36px rgba(245,200,66,0.12); }
  }
  @keyframes cardGlow2Hover {
    0%,100% { box-shadow: 0 0 26px rgba(176,184,204,0.3), 0 0 70px rgba(176,184,204,0.15), inset 0 0 24px rgba(176,184,204,0.06); }
    50%     { box-shadow: 0 0 42px rgba(176,184,204,0.5), 0 0 105px rgba(176,184,204,0.25), inset 0 0 32px rgba(176,184,204,0.1); }
  }
  @keyframes cardGlow3Hover {
    0%,100% { box-shadow: 0 0 26px rgba(205,124,58,0.3), 0 0 70px rgba(205,124,58,0.15), inset 0 0 24px rgba(205,124,58,0.06); }
    50%     { box-shadow: 0 0 42px rgba(205,124,58,0.5), 0 0 105px rgba(205,124,58,0.25), inset 0 0 32px rgba(205,124,58,0.1); }
  }

  @keyframes cardGlow1 {
    0%,100% { box-shadow: 0 0 20px rgba(245,200,66,0.15), 0 0 60px rgba(245,200,66,0.06), inset 0 0 20px rgba(245,200,66,0.03); }
    50%     { box-shadow: 0 0 35px rgba(245,200,66,0.3),  0 0 90px rgba(245,200,66,0.12), inset 0 0 30px rgba(245,200,66,0.06); }
  }
  @keyframes cardGlow2 {
    0%,100% { box-shadow: 0 0 20px rgba(176,184,204,0.12), 0 0 50px rgba(176,184,204,0.05), inset 0 0 20px rgba(176,184,204,0.02); }
    50%     { box-shadow: 0 0 30px rgba(176,184,204,0.25), 0 0 75px rgba(176,184,204,0.1),  inset 0 0 25px rgba(176,184,204,0.05); }
  }
  @keyframes cardGlow3 {
    0%,100% { box-shadow: 0 0 20px rgba(205,124,58,0.12), 0 0 50px rgba(205,124,58,0.05), inset 0 0 20px rgba(205,124,58,0.02); }
    50%     { box-shadow: 0 0 30px rgba(205,124,58,0.25), 0 0 75px rgba(205,124,58,0.1),  inset 0 0 25px rgba(205,124,58,0.05); }
  }

  @keyframes scanMove {
    0%   { transform: translateY(-100vh); }
    100% { transform: translateY(100vh); }
  }
  @keyframes bootFadeIn {
    from { opacity: 0; transform: translateX(-8px); }
    to   { opacity: 1; transform: translateX(0); }
  }
  @keyframes blink {
    0%,49% { opacity: 1; }
    50%,100% { opacity: 0; }
  }
  @keyframes bootFlicker {
    0%,18%,20%,22%,24%,60%,62%,100% { opacity: 1; }
    19%,21%,23%,61% { opacity: 0.3; }
  }
  @keyframes bootExit {
    0%   { opacity: 1; transform: scale(1); }
    50%  { opacity: 0.4; transform: scale(1.02); }
    100% { opacity: 0; transform: scale(1.06); }
  }

  @keyframes rowSlideIn {
    from { opacity: 0; transform: translateX(-24px); }
    to   { opacity: 1; transform: translateX(0); }
  }
  @keyframes podiumRise {
    from { opacity: 0; transform: translateY(40px) scale(0.92); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  @keyframes headerSlide {
    from { opacity: 0; transform: translateY(-20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @keyframes titleGlitch {
    0%,87%,100%  { transform: none; text-shadow: none; }
    88%  { transform: translateX(-3px); text-shadow: 3px 0 #d946ef; }
    90%  { transform: translateX(3px);  text-shadow: -3px 0 #06b6d4; }
    92%  { transform: none; }
  }

  @keyframes streakFire {
    0%,100% { filter: brightness(1) saturate(1); }
    50%     { filter: brightness(1.3) saturate(1.5); }
  }

  .boot-screen { animation: bootFlicker 0.4s 1.8s ease; }
  .boot-exit   { animation: bootExit 0.5s ease forwards; }

  .trophy-1 { animation: trophyFloat  4.2s ease-in-out infinite; }
  .trophy-2 { animation: trophyFloat2 5.1s ease-in-out infinite; }
  .trophy-3 { animation: trophyFloat3 4.7s ease-in-out infinite; }

  .trophy-glow-1 { animation: goldPulse   3.5s ease-in-out infinite; }
  .trophy-glow-2 { animation: silverPulse 4.0s ease-in-out infinite 0.5s; }
  .trophy-glow-3 { animation: bronzePulse 4.2s ease-in-out infinite 1s; }

  .card-glow-1 { animation: cardGlow1 4s ease-in-out infinite; }
  .card-glow-2 { animation: cardGlow2 4.5s ease-in-out infinite 0.5s; }
  .card-glow-3 { animation: cardGlow3 5s ease-in-out infinite 1s; }

  .title-glitch { animation: titleGlitch 8s ease-in-out infinite; }
  .streak-fire  { animation: streakFire 1.5s ease-in-out infinite; }

  /* ── Podium hover interaction ── */
  .podium-col { cursor: pointer; transition: transform 0.25s cubic-bezier(0.16,1,0.3,1); }
  .podium-col:hover { transform: translateY(-6px); }

  .podium-col:hover .trophy-glow-1 { animation: goldPulseHover   1.1s ease-in-out infinite; }
  .podium-col:hover .trophy-glow-2 { animation: silverPulseHover 1.1s ease-in-out infinite; }
  .podium-col:hover .trophy-glow-3 { animation: bronzePulseHover 1.1s ease-in-out infinite; }

  .podium-col:hover .card-glow-1 { animation: cardGlow1Hover 1.2s ease-in-out infinite; }
