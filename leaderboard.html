<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Leaderboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:          #07080d;
      --surface:     #0c0e14;
      --surface-hi:  #10131e;
      --border:      #1a1d28;
      --text:        #e8eaf0;
      --text-mid:    #d4d8e8;
      --text-dim:    #3a3f52;
      --text-muted:  #2e3347;
      --label:       #4b5163;
      --cyan:        #00C9B1;
      --red:         #FF2F6B;
      --orange:      #FF8C42;
      --green:       #00C9B1;
      --loss-red:    #f87171;
      --streak:      #e8a02a;
      --grad:        linear-gradient(135deg, #7B2FFF 0%, #00C9B1 100%);
      --grad-subtle: linear-gradient(135deg, #7B2FFF22 0%, #00C9B122 100%);
      --grad-loss:   linear-gradient(135deg, #FF2F6B 0%, #FF8C42 100%);
      --grad-loss-s: linear-gradient(135deg, #FF2F6B22 0%, #FF8C4222 100%);
      --gold:   #f5c842;
      --silver: #b0b8cc;
      --bronze: #cd7c3a;
      --sans: 'Inter', system-ui, sans-serif;
      --mono: 'JetBrains Mono', monospace;
    }

    html, body { height: 100%; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      min-height: 100%;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }
    body::-webkit-scrollbar { width: 4px; }
    body::-webkit-scrollbar-track { background: transparent; }
    body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    /* ── Layout ── */
    .wrap { max-width: 1140px; margin: 0 auto; padding: 0 32px; }

    header {
      padding: 32px 0 24px;
      border-bottom: 1px solid var(--border);
    }
    .header-inner {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .season-label {
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-bottom: 4px;
      background: var(--grad);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      transition: background 0.25s;
    }
    .season-label.loss-mode {
      background: var(--grad-loss);
      -webkit-background-clip: text;
      background-clip: text;
    }

    h1 { font-size: 30px; font-weight: 700; letter-spacing: -0.02em; color: var(--text); }
    .subtitle { font-size: 13px; color: var(--label); margin-top: 4px; }

    /* ── Controls ── */
    .controls { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }

    .tab-row {
      display: flex;
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid var(--border);
      background: #0f1118;
    }
    .tab-row button {
      padding: 8px 16px;
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.05em;
      background: transparent;
      color: var(--label);
      border: none;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
      white-space: nowrap;
    }
    .tab-row button.active-normal { background: var(--grad); color: #fff; }
    .tab-row button.active-loss   { background: var(--grad-loss); color: #fff; }

    .period-row {
      display: flex;
      border-radius: 4px;
      overflow: hidden;
      border: 1px solid var(--border);
      background: #0b0d14;
      max-height: 0;
      opacity: 0;
      pointer-events: none;
      transition: max-height 0.2s, opacity 0.2s;
    }
    .period-row.visible { max-height: 40px; opacity: 1; pointer-events: auto; }
    .period-row button {
      padding: 6px 12px;
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 600;
      background: transparent;
      color: var(--label);
      border: none;
      border-bottom: 1px solid transparent;
      cursor: pointer;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }
    .period-row button.active-normal {
      background: var(--grad-subtle);
      color: var(--cyan);
      border-bottom-color: var(--cyan);
    }
    .period-row button.active-loss {
      background: var(--grad-loss-s);
      color: var(--orange);
      border-bottom-color: var(--orange);
    }

    /* ── Loss banner ── */
    .loss-banner {
      display: none;
      align-items: center;
      gap: 8px;
      margin-top: 16px;
      padding: 10px 16px;
      border-radius: 8px;
      font-family: var(--mono);
      font-size: 11px;
      background: rgba(255,47,107,0.08);
      border: 1px solid rgba(255,47,107,0.18);
      color: #ff8080;
    }
    .loss-banner.visible { display: flex; }
    .loss-banner-icon {
      display: inline-flex;
      align-items: center;
      flex-shrink: 0;
      color: #ff8080;
    }

    /* ── Podium (Discord / Game Leaderboard Style) ── */
    .podium-section {
      padding: 24px 0;
      border-bottom: 1px solid var(--border);
    }
    .podium-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      align-items: end;
      gap: 16px;
    }
    .podium-card {
      position: relative;
      border-radius: 12px;
      padding: 16px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      border: 1px solid transparent;
      transition: transform 0.2s;
      cursor: default;
    }
    .podium-card:hover { transform: translateY(-2px); }

    /* 2nd / 1st / 3rd layout order & height hierarchy */
    .podium-card.rank-1 {
      order: 2;
      padding: 24px 16px 20px;
      min-height: 200px;
    }
    .podium-card.rank-1:hover { transform: translateY(-4px); }
    .podium-card.rank-2 {
      order: 1;
      min-height: 172px;
      padding: 16px 12px 16px;
    }
    .podium-card.rank-3 {
      order: 3;
      min-height: 156px;
      padding: 14px 10px 14px;
    }

    .podium-card .top-stripe {
      display: none;
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      border-radius: 12px 12px 0 0;
    }
    .podium-card.rank-1 .top-stripe { display: block; }

    .podium-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 8px;
    }
    .podium-card.rank-1 .podium-icon svg { width: 26px; height: 26px; }
    .podium-card.rank-2 .podium-icon svg { width: 22px; height: 22px; }
    .podium-card.rank-3 .podium-icon svg { width: 20px; height: 20px; }

    .podium-avatar {
      width: 40px; height: 40px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-family: var(--mono);
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 8px;
      color: #0a0b0f;
    }
    .podium-card.rank-1 .podium-avatar {
      width: 48px; height: 48px;
      font-size: 15px;
      margin-bottom: 10px;
    }
    .podium-card.rank-3 .podium-avatar {
      width: 38px; height: 38px;
      font-size: 12px;
    }

    .podium-name { font-size: 11px; font-weight: 600; color: #c8ccd8; width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .podium-card.rank-1 .podium-name { font-size: 12px; }
    .podium-value { font-family: var(--mono); font-size: 13px; font-weight: 700; margin-top: 4px; }
    .podium-card.rank-1 .podium-value { font-size: 14px; }
    .podium-level { font-family: var(--mono); font-size: 11px; color: var(--label); margin-top: 2px; }

    /* ── Table ── */
    .table-section { flex: 1; padding: 16px 0 40px; }

    .col-headers {
      display: grid;
      align-items: center;
      padding: 8px 16px;
      margin-bottom: 4px;
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-dim);
    }
    .col-headers span.text-right { text-align: right; }
    .col-headers .col-metric { transition: color 0.2s; }

    .rows-container { display: flex; flex-direction: column; gap: 2px; }

    .row {
      position: relative;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--border);
      background: var(--surface);
      cursor: default;
      transition: background 0.15s;
    }
    .row:hover { background: var(--surface-hi); }

    .row-bar {
      position: absolute;
      top: 0; bottom: 0; left: 0;
      opacity: 0.1;
      transition: width 0.5s;
      pointer-events: none;
    }

    .row-inner {
      position: relative;
      display: grid;
      align-items: center;
      padding: 12px 16px;
    }

    .row-rank {
      font-family: var(--mono);
      font-size: 13px;
      font-weight: 700;
      color: var(--text-muted);
    }

    .player-cell { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .row-avatar {
      width: 32px; height: 32px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 700;
      background: #13161f;
      color: var(--label);
    }
    .player-info { min-width: 0; }
    .player-name { font-size: 13px; font-weight: 600; color: var(--text-mid); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .player-level { font-family: var(--mono); font-size: 11px; color: var(--text-dim); }

    .col-num {
      text-align: right;
      font-family: var(--mono);
      font-size: 13px;
      font-variant-numeric: tabular-nums;
      color: var(--text-muted);
    }
    .col-num.active { color: var(--text); font-weight: 600; }

    .col-dynamic {
      text-align: right;
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    .streak-cell { display: flex; align-items: center; justify-content: flex-end; gap: 4px; }
    .streak-icon { display: inline-flex; align-items: center; color: var(--streak); }
    .streak-val { font-family: var(--mono); font-size: 11px; font-weight: 500; color: var(--streak); }
    .streak-dash { font-family: var(--mono); font-size: 11px; color: var(--text-muted); }

    .footer-note {
      text-align: center;
      font-family: var(--mono);
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 24px;
    }

    /* column layout shared between headers and rows */
    .grid-cols { grid-template-columns: 3rem 1fr 9rem 9rem 7.5rem 5rem; }

    @media (max-width: 620px) {
      .grid-cols { grid-template-columns: 2rem 1fr 5.5rem 5rem 4.5rem 3rem; }
      h1 { font-size: 22px; }
      .tab-row button { padding: 8px 10px; font-size: 10px; }
      .period-row button { padding: 6px 8px; }
      .podium-grid { gap: 6px; }
      .podium-card.rank-1 { min-height: 175px; padding: 16px 8px 14px; }
      .podium-card.rank-2 { min-height: 150px; padding: 12px 6px 12px; }
      .podium-card.rank-3 { min-height: 138px; padding: 10px 6px 10px; }
      .podium-card.rank-1 .podium-avatar { width: 40px; height: 40px; font-size: 13px; }
      .podium-avatar { width: 34px; height: 34px; font-size: 11px; }
      .podium-card.rank-3 .podium-avatar { width: 32px; height: 32px; font-size: 10px; }
    }
  </style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="header-inner">
      <div>
        <p class="season-label" id="season-label">Season 4 · Week 12</p>
        <h1>Leaderboard</h1>
        <p class="subtitle" id="subtitle"></p>
      </div>
      <div class="controls">
        <div class="tab-row" id="metric-tabs"></div>
        <div class="period-row" id="period-row"></div>
      </div>
    </div>
    <div class="loss-banner" id="loss-banner">
      <span class="loss-banner-icon">
        <svg class="lucide lucide-skull" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m12.5 17-.5-1-.5 1h1z" />
          <path d="M15 22a1 1 0 0 0 1-1v-1a2 2 0 0 0 1.56-3.25 8 8 0 1 0-11.12 0A2 2 0 0 0 8 20v1a1 1 0 0 0 1 1z" />
          <circle cx="15" cy="12" r="1" />
          <circle cx="9" cy="12" r="1" />
        </svg>
      </span>
      <span>Ranked by worst drawdown over the selected period — #1 = most rekt.</span>
    </div>
  </header>

  <div class="podium-section">
    <div class="podium-grid" id="podium"></div>
  </div>

  <div class="table-section">
    <div class="col-headers grid-cols" id="col-headers">
      <span>#</span>
      <span>Player</span>
      <span class="text-right">Net Worth</span>
      <span class="text-right">Total XP</span>
      <span class="text-right col-metric" id="col-metric-header">24h Chg</span>
      <span class="text-right">Streak</span>
    </div>
    <div class="rows-container" id="rows"></div>
    <p class="footer-note">Rankings reset every Sunday at 00:00 UTC · Season 4 ends in 18 days</p>
  </div>
</div>

<script>
  // =========================================================================
  // === LIVE_USER_DATA — swap for a real fetch once Virtual Trading ships ===
  // =========================================================================
  const PLAYERS = [
    { id: 1, username: "28ryzo",        avatar: "RS", level: 1, netWorth: 0, xp: 0, change24h: 0, streak: 0, returns: { "1M": 0, "3M": 0, "6M": 0, "1Y": 0 }, losses: { "1M": 0, "3M": 0, "6M": 0, "1Y": 0 } },
    { id: 2, username: "akshar",        avatar: "AK", level: 1, netWorth: 0, xp: 0, change24h: 0, streak: 0, returns: { "1M": 0, "3M": 0, "6M": 0, "1Y": 0 }, losses: { "1M": 0, "3M": 0, "6M": 0, "1Y": 0 } },
    { id: 3, username: "akshar2",       avatar: "A2", level: 1, netWorth: 0, xp: 0, change24h: 0, streak: 0, returns: { "1M": 0, "3M": 0, "6M": 0, "1Y": 0 }, losses: { "1M": 0, "3M": 0, "6M": 0, "1Y": 0 } },
    { id: 4, username: "akshar45",      avatar: "A4", level: 1, netWorth: 0, xp: 0, change24h: 0, streak: 0, returns: { "1M": 0, "3M": 0, "6M": 0, "1Y": 0 }, losses: { "1M": 0, "3M": 0, "6M": 0, "1Y": 0 } },
    { id: 5, username: "amanraj",       avatar: "AR", level: 1, netWorth: 0, xp: 0, change24h: 0, streak: 0, returns: { "1M": 0, "3M": 0, "6M": 0, "1Y": 0 }, losses: { "1M": 0, "3M": 0, "6M": 0, "1Y": 0 } },
    { id: 6, username: "krish_surne",   avatar: "KS", level: 1, netWorth: 0, xp: 0, change24h: 0, streak: 0, returns: { "1M": 0, "3M": 0, "6M": 0, "1Y": 0 }, losses: { "1M": 0, "3M": 0, "6M": 0, "1Y": 0 } },
    { id: 7, username: "thaheer",       avatar: "TH", level: 1, netWorth: 0, xp: 0, change24h: 0, streak: 0, returns: { "1M": 0, "3M": 0, "6M": 0, "1Y": 0 }, losses: { "1M": 0, "3M": 0, "6M": 0, "1Y": 0 } },
    { id: 8, username: "thaheer_basha", avatar: "TB", level: 1, netWorth: 0, xp: 0, change24h: 0, streak: 0, returns: { "1M": 0, "3M": 0, "6M": 0, "1Y": 0 }, losses: { "1M": 0, "3M": 0, "6M": 0, "1Y": 0 } },
    { id: 9, username: "vanshika",      avatar: "VA", level: 1, netWorth: 0, xp: 0, change24h: 0, streak: 0, returns: { "1M": 0, "3M": 0, "6M": 0, "1Y": 0 }, losses: { "1M": 0, "3M": 0, "6M": 0, "1Y": 0 } },
  ];

  // ─────────────────────────────────────────────
  //  State
  // ─────────────────────────────────────────────
  const METRICS  = ["netWorth", "xp", "returns", "losses"];
  const LABELS   = { netWorth: "NET WORTH", xp: "TOTAL XP", returns: "RETURNS", losses: "LOSSES" };
  const PERIODS  = ["1M", "3M", "6M", "1Y"];

  // Lucide SVG Icons (MIT-Licensed)
  const ICONS = [
    // 1st place: crown
    `<svg class="lucide lucide-crown" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11.562 3.266a.5.5 0 0 1 .876 0L15.39 8.87a1 1 0 0 0 1.516.294L21.183 5.5a.5.5 0 0 1 .798.519l-2.834 10.246a1 1 0 0 1-.956.734H5.81a1 1 0 0 1-.957-.734L2.02 6.02a.5.5 0 0 1 .798-.519l4.276 3.664a1 1 0 0 0 1.516-.294z"/><path d="M5 21h14"/></svg>`,
    // 2nd place: medal
    `<svg class="lucide lucide-medal" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7.21 15 2.66 7.14a2 2 0 0 1 .13-2.2L4.4 2.8A2 2 0 0 1 6 2h12a2 2 0 0 1 1.6.8l1.6 2.14a2 2 0 0 1 .14 2.2L16.79 15"/><path d="M11 12 5.12 2.2"/><path d="m13 12 5.88-9.8"/><path d="M8 7h8"/><circle cx="12" cy="17" r="5"/><path d="M12 18v-2h-.5"/></svg>`,
    // 3rd place: medal
    `<svg class="lucide lucide-medal" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7.21 15 2.66 7.14a2 2 0 0 1 .13-2.2L4.4 2.8A2 2 0 0 1 6 2h12a2 2 0 0 1 1.6.8l1.6 2.14a2 2 0 0 1 .14 2.2L16.79 15"/><path d="M11 12 5.12 2.2"/><path d="m13 12 5.88-9.8"/><path d="M8 7h8"/><circle cx="12" cy="17" r="5"/><path d="M12 18v-2h-.5"/></svg>`
  ];

  const FLAME_ICON = `<svg class="lucide lucide-flame" xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3q1 4 4 6.5t3 5.5a1 1 0 0 1-14 0 5 5 0 0 1 1-3 1 1 0 0 0 5 0c0-2-1.5-3-1.5-5q0-2 2.5-4"/></svg>`;

  let metric = "netWorth";
  let period = "1M";

  // ─────────────────────────────────────────────
  //  Helpers
  // ─────────────────────────────────────────────
  const fmtMoney = n =>
    n >= 1e6 ? `₹${(n/1e6).toFixed(2)}M` : n >= 1e3 ? `₹${(n/1e3).toFixed(1)}K` : `₹${n}`;
  const fmtXP    = n => n >= 1e3 ? `${(n/1e3).toFixed(1)}K` : `${n}`;
  const fmtRet   = n => `${n >= 0 ? "+" : ""}${n.toFixed(1)}%`;
  const fmtLoss  = n => `${n.toFixed(1)}%`;

  const RANK_STYLES = [
    { // rank 1 (gold)
      text: "#f5c842",
      iconColor: "var(--gold)",
      cardBg: "linear-gradient(135deg,rgba(245,200,66,.07) 0%,rgba(245,200,66,.04) 100%),#0f1018",
      border: "rgba(245,200,66,0.25)",
      avatarGrad: "linear-gradient(135deg,#c9a22a,#f5c842)",
      avatarColor: "#0a0b0f",
    },
    { // rank 2 (silver)
      text: "#b0b8cc",
      iconColor: "var(--silver)",
      cardBg: "linear-gradient(135deg,rgba(176,184,204,.05) 0%,rgba(176,184,204,.02) 100%),#0c0e14",
      border: "rgba(176,184,204,0.18)",
      avatarGrad: "linear-gradient(135deg,#8a94a6,#b0b8cc)",
      avatarColor: "#0a0b0f",
    },
    { // rank 3 (bronze)
      text: "#cd7c3a",
      iconColor: "var(--bronze)",
      cardBg: "linear-gradient(135deg,rgba(205,124,58,.06) 0%,rgba(205,124,58,.03) 100%),#0c0e14",
      border: "rgba(205,124,58,0.20)",
      avatarGrad: "linear-gradient(135deg,#a0612c,#cd7c3a)",
      avatarColor: "#0a0b0f",
    },
  ];

  const GRAD      = "linear-gradient(135deg,#7B2FFF 0%,#00C9B1 100%)";
  const GRAD_LOSS = "linear-gradient(135deg,#FF2F6B 0%,#FF8C42 100%)";

  function getAccent(rankIndex) {
    // rankIndex 0/1/2 = gold/silver/bronze; else generic
    return rankIndex < 3 ? RANK_STYLES[rankIndex] : null;
  }

  function getSortValue(p) {
    if (metric === "returns") return p.returns[period];
    if (metric === "losses")  return p.losses[period];
    return p[metric];
  }

  function getSorted() {
    const isLoss = metric === "losses";
    return [...PLAYERS].sort((a, b) =>
      isLoss ? getSortValue(a) - getSortValue(b)
             : getSortValue(b) - getSortValue(a)
    );
  }

  // ─────────────────────────────────────────────
  //  Build static chrome (tabs / period buttons)
  // ─────────────────────────────────────────────
  const metricTabsEl = document.getElementById("metric-tabs");
  const periodRowEl  = document.getElementById("period-row");

  METRICS.forEach(m => {
    const btn = document.createElement("button");
    btn.dataset.metric = m;
    btn.textContent = LABELS[m];
    btn.addEventListener("click", () => { metric = m; render(); });
    metricTabsEl.appendChild(btn);
  });

  PERIODS.forEach(p => {
    const btn = document.createElement("button");
    btn.dataset.period = p;
    btn.textContent = p;
    btn.addEventListener("click", () => { period = p; render(); });
    periodRowEl.appendChild(btn);
  });

  // ─────────────────────────────────────────────
  //  Render
  // ─────────────────────────────────────────────
  function render() {
    const isLoss    = metric === "losses";
    const hasPeriod = metric === "returns" || metric === "losses";
    const sorted    = getSorted();
    const maxAbs    = Math.max(...sorted.map(p => Math.abs(getSortValue(p))));

    // — season label gradient
    const seasonEl = document.getElementById("season-label");
    seasonEl.classList.toggle("loss-mode", isLoss);

    // — subtitle
    document.getElementById("subtitle").textContent =
      `${PLAYERS.length} active traders · Updated 2 min ago`;

    // — loss banner
    document.getElementById("loss-banner").classList.toggle("visible", isLoss);

    // — metric tab active states
    metricTabsEl.querySelectorAll("button").forEach(btn => {
      const active = btn.dataset.metric === metric;
      const thisLoss = btn.dataset.metric === "losses";
      btn.className = active ? (thisLoss ? "active-loss" : "active-normal") : "";
    });

    // — period row visibility + active states
    periodRowEl.classList.toggle("visible", hasPeriod);
    periodRowEl.querySelectorAll("button").forEach(btn => {
      const active = btn.dataset.period === period;
      btn.className = (active && hasPeriod) ? (isLoss ? "active-loss" : "active-normal") : "";
    });

    // — col header dynamic label
    const metricHeader = document.getElementById("col-metric-header");
    if (metric === "returns") {
      metricHeader.textContent = `Return ${period}`;
      metricHeader.style.color = "#00C9B1";
    } else if (metric === "losses") {
      metricHeader.textContent = `Loss ${period}`;
      metricHeader.style.color = "#FF2F6B";
    } else {
      metricHeader.textContent = "24h Chg";
      metricHeader.style.color = "#3a3f52";
    }

    // ── Podium ──────────────────────────────────
    const podium = document.getElementById("podium");
    podium.innerHTML = "";

    sorted.slice(0, 3).forEach((player, i) => {
      const rank   = i + 1;
      const a      = RANK_STYLES[i];
      const rawVal = getSortValue(player);

      let display, valueColor;
      if (metric === "netWorth") { display = fmtMoney(player.netWorth); valueColor = a.text; }
      else if (metric === "xp") { display = `${fmtXP(player.xp)} XP`; valueColor = a.text; }
      else if (metric === "losses") { display = fmtLoss(rawVal); valueColor = "#FF2F6B"; }
      else { display = fmtRet(rawVal); valueColor = rawVal >= 0 ? "#00C9B1" : "#f87171"; }

      const card = document.createElement("div");
      card.className = `podium-card rank-${rank}`;
      card.style.background = a.cardBg;
      card.style.borderColor = a.border;

      const stripe = document.createElement("div");
      stripe.className = "top-stripe";
      stripe.style.background = isLoss ? GRAD_LOSS : GRAD;

      card.innerHTML = `
        <div class="podium-icon" style="color:${a.iconColor}">${ICONS[i]}</div>
        <div class="podium-avatar" style="background:${a.avatarGrad};color:${a.avatarColor}">${player.avatar}</div>
        <div class="podium-name">${escHtml(player.username)}</div>
        <div class="podium-value" style="color:${valueColor}">${display}</div>
        <div class="podium-level">Lv.${player.level}</div>
      `;
      card.prepend(stripe);
      podium.appendChild(card);
    });

    // ── Table rows ──────────────────────────────
    const rowsEl = document.getElementById("rows");
    rowsEl.innerHTML = "";

    sorted.forEach((player, i) => {
      const rank   = i + 1;
      const isTop3 = rank <= 3;
      const a      = isTop3 ? RANK_STYLES[i] : null;
      const sortVal = getSortValue(player);
      const barPct  = maxAbs > 0 ? Math.round((Math.abs(sortVal) / maxAbs) * 100) : 0;
      const barGrad = isTop3
        ? (isLoss ? GRAD_LOSS : (rank === 1 ? "linear-gradient(90deg,#f5c842,#f9e08a)" : rank === 2 ? "linear-gradient(90deg,#8a94a6,#b0b8cc)" : "linear-gradient(90deg,#a0612c,#cd7c3a)"))
        : (isLoss ? GRAD_LOSS : GRAD);

      // dynamic metric cell
      let dynText, dynColor;
      if (metric === "losses") {
        dynText  = fmtLoss(player.losses[period]);
        dynColor = "#FF2F6B";
      } else if (metric === "returns") {
        const v  = player.returns[period];
        dynText  = fmtRet(v);
        dynColor = v >= 0 ? "#00C9B1" : "#f87171";
      } else {
        const pos = player.change24h >= 0;
        dynText   = `${pos ? "+" : ""}${player.change24h.toFixed(1)}%`;
        dynColor  = pos ? "#00C9B1" : "#f87171";
      }

      const row = document.createElement("div");
      row.className = "row";
      if (isTop3) row.style.borderColor = a.border;

      const avatarBg    = isTop3 ? a.avatarGrad   : "#13161f";
      const avatarColor = isTop3 ? a.avatarColor  : "#4b5163";
      const rankColor   = isTop3 ? a.text         : "#2e3347";
      const nwActive    = metric === "netWorth";
      const xpActive    = metric === "xp";

      row.innerHTML = `
        <div class="row-bar" style="width:${barPct}%;background:${barGrad}"></div>
        <div class="row-inner grid-cols">
          <span class="row-rank" style="color:${rankColor}">${rank}</span>
          <div class="player-cell">
            <div class="row-avatar" style="background:${avatarBg};color:${avatarColor}">${player.avatar}</div>
            <div class="player-info">
              <div class="player-name">${escHtml(player.username)}</div>
              <div class="player-level">Lv.${player.level}</div>
            </div>
          </div>
          <span class="col-num ${nwActive ? "active" : ""}">${fmtMoney(player.netWorth)}</span>
          <span class="col-num ${xpActive ? "active" : ""}">${fmtXP(player.xp)} XP</span>
          <span class="col-dynamic" style="color:${dynColor}">${dynText}</span>
          <div class="streak-cell">
            ${player.streak > 0
              ? `<span class="streak-icon">${FLAME_ICON}</span><span class="streak-val">${player.streak}d</span>`
              : `<span class="streak-dash">—</span>`}
          </div>
        </div>
      `;
      rowsEl.appendChild(row);
    });
  }

  function escHtml(s) {
    return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }

  render();
</script>
</body>
</html>
